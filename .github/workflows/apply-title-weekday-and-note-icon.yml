name: Apply title weekday and note icon

on:
  push:
    paths:
      - ".github/workflows/apply-title-weekday-and-note-icon.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update source files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # 気持ちアイコンを、入力欄で使っているレポート風アイコンへ統一する。
          old_icon = '''      <path d="m4 16.7-.7 4 4-.7L18.7 8.6l-3.3-3.3L4 16.7Z" />
              <path d="m13.9 6.8 3.3 3.3" />'''
          new_icon = '''      <path d="M5.5 4.8h13v14.4H9.3l-3.8 2.4V4.8Z" />
              <path d="M8.3 9h7.4M8.3 12.6h5.4" />'''

          icon_replacements = 0
          for path in Path("src").rglob("*.tsx"):
              text = path.read_text(encoding="utf-8")
              count = text.count(old_icon)
              if count:
                  path.write_text(text.replace(old_icon, new_icon), encoding="utf-8")
                  icon_replacements += count

          if icon_replacements < 1:
              raise SystemExit("ペン型の気持ちアイコンが見つかりませんでした。")

          # 既定の日付タイトルを m/d 曜「」へ変更する。
          memo_path = Path("src/types/memo.ts")
          memo_text = memo_path.read_text(encoding="utf-8")
          old_date = '''function formatMemoDatePrefix(date: Date): string {
            return `${date.getMonth() + 1}/${date.getDate()}`;
          }'''
          new_date = '''const JAPANESE_WEEKDAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"] as const;

          function formatMemoDatePrefix(date: Date): string {
            const weekday = JAPANESE_WEEKDAY_LABELS[date.getDay()];
            return `${date.getMonth() + 1}/${date.getDate()} ${weekday}`;
          }'''

          if old_date not in memo_text:
              raise SystemExit("日付タイトル関数が想定した形で見つかりませんでした。")

          memo_path.write_text(memo_text.replace(old_date, new_date, 1), encoding="utf-8")
          PY

      - name: Verify build
        run: npm ci && npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components src/types/memo.ts
          git commit -m "気持ちアイコンと曜日付きタイトルを統一"
          git push
