name: 仕立て直しの検証
on:
  push:
    branches: [shitate-p1-p3-review-20261010]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v5
      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 依存関係を復元
        run: npm ci
      - name: 型検査と本番ビルド
        run: npm run build
