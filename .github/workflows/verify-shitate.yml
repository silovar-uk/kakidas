name: 仕立て直しの検証
on:
  push:
    branches: [shitate-p1-p3-review-20261010, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: 受け入れ確認 ${{ matrix.phase }}
    strategy:
      fail-fast: false
      matrix:
        phase: [P1, P2, P3]
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v5
      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 依存関係を復元
        run: npm ci
      - name: 型検査と本番ビルド
        run: npm run build
      - name: Playwrightを用意
        timeout-minutes: 8
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: 受け入れ確認(amu・outline・shitate・togu)
        timeout-minutes: 15
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/kakidas-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          status=0
          QA_TARGET=app QA_PHASES=${{ matrix.phase }} BASE_URL=http://127.0.0.1:4173/ node docs/amu/qa.mjs || status=1
          QA_PHASES=${{ matrix.phase }} BASE_URL=http://127.0.0.1:4173/ node docs/outline/qa.mjs || status=1
          QA_TARGET=app QA_PHASES=${{ matrix.phase }} BASE_URL=http://127.0.0.1:4173/ node docs/shitate/qa.mjs || status=1
          QA_PHASES=${{ matrix.phase }} BASE_URL=http://127.0.0.1:4173/ node docs/togu/qa.mjs || status=1
          exit "$status"
      - name: PC・スマホの本番前画面を撮影
        if: matrix.phase == 'P3'
        timeout-minutes: 15
        run: |
          mkdir -p /tmp/togu-shots
          OUT=/tmp/togu-shots BASE_URL=http://127.0.0.1:4173/ node docs/togu/proto/shots.mjs
      - name: 画面検証写真・測定記録を保存
        if: matrix.phase == 'P3' && always()
        uses: actions/upload-artifact@v4
        with:
          name: kakidas-amu-screenshots
          path: /tmp/togu-shots/
          if-no-files-found: warn

  responsive:
    name: 13幅のボタン重なり検証
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソース取得
        uses: actions/checkout@v5
      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 依存関係を復元
        run: npm ci
      - name: 本番ビルド
        run: npm run build
      - name: Playwrightを用意
        timeout-minutes: 8
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: レスポンシブ衝突確認
        timeout-minutes: 12
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/kakidas-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          QA_SHOTS_DIR=/tmp/kakidas-responsive node docs/layout/qa.mjs
      - name: 書き口と周辺の明度・操作・文字の可読性を検証
        timeout-minutes: 8
        run: |
          OUT=/tmp/kakidas-write-focus BASE_URL=http://127.0.0.1:4173/ node docs/write-focus/qa.mjs
      - name: PC・スマホの書き口配色の画面写真を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kakidas-writing-focus-screenshots
          path: /tmp/kakidas-write-focus/
          if-no-files-found: warn
      - name: 幅別の画面写真を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kakidas-responsive-13-widths
          path: /tmp/kakidas-responsive/
          if-no-files-found: warn

  production:
    name: 本番受け入れ確認 ${{ matrix.phase }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, responsive]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [P1, P2, P3]
    steps:
      - name: ソース取得
        uses: actions/checkout@v5
      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 依存関係を復元
        run: npm ci
      - name: Playwrightを用意
        timeout-minutes: 8
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Vercel本番デプロイを待つ
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/status
        run: |
          for i in $(seq 1 60); do
            if curl --silent --show-error --fail --retry 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$STATUS_URL" \
              | jq -e --arg ctx "Vercel – kakidas-3gqw" \
              '.statuses | any(.context == $ctx and .state == "success")' > /dev/null; then
              echo "対象コミットのVercelステータスがsuccess"
              exit 0
            fi
            sleep 10
          done
          echo "::error::対象コミットのVercel本番反映が確認できない"
          exit 1
      - name: 本番amu受け入れ確認(35項目)
        timeout-minutes: 15
        env:
          QA_TARGET: app
          QA_PHASES: ${{ matrix.phase }}
          BASE_URL: https://kakidas-3gqw.vercel.app/
        run: node docs/amu/qa.mjs
      - name: 本番アウトライン専用受け入れ確認
        timeout-minutes: 15
        env:
          QA_PHASES: ${{ matrix.phase }}
          BASE_URL: https://kakidas-3gqw.vercel.app/
        run: node docs/outline/qa.mjs
      - name: 本番29項目の受け入れ確認
        timeout-minutes: 15
        env:
          QA_TARGET: app
          QA_PHASES: ${{ matrix.phase }}
          BASE_URL: https://kakidas-3gqw.vercel.app/
        run: node docs/shitate/qa.mjs
      - name: 本番30項目の受け入れ確認
        timeout-minutes: 15
        env:
          QA_PHASES: ${{ matrix.phase }}
          BASE_URL: https://kakidas-3gqw.vercel.app/
        run: node docs/togu/qa.mjs
